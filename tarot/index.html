<title>별빛 타로 학교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 여정 지도(세로 3막) → 레슨은 카드 무대 | 안내 패널 2단, 폰에서는 1단.
   단일 테마(밤하늘)로 고정한 디자인이라 모든 색을 명시적으로 지정한다. */
:root{
  --night:#080b24;
  --deep:#11164a;
  --veil:#1b2160;
  --gold:#e9c97f;
  --gold-dim:#a88a48;
  --lav:#b9a8ff;
  --rose:#ef9fb7;
  --moon:#f4f0ff;
  --muted:#aeabd6;
  --teal:#86d3d8;
  --ok:#8fe0b0;
  --bad:#f3a0a0;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:
    radial-gradient(ellipse 80% 50% at 15% -5%, rgba(80,70,190,.35), transparent 70%),
    radial-gradient(ellipse 60% 40% at 95% 5%, rgba(150,70,160,.22), transparent 70%),
    var(--night);
  background-attachment:fixed;
  color:var(--moon);font-family:var(--f-body);font-size:16px;line-height:1.7;
}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.02em}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(233,201,127,.35);background:rgba(17,22,74,.7);
  border-radius:999px;padding:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.pill i{font-style:normal;color:var(--gold)}

/* 공통 타이포 */
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,46px);line-height:1.25}
h2{font-size:clamp(22px,3.6vw,28px);line-height:1.35}
h3{font-size:18px}
p{margin:0}
.eyebrow{font-family:var(--f-latin);font-size:12px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:999px;
  padding:11px 22px;font-size:15px;border:1px solid var(--gold);background:linear-gradient(180deg,#f3d995,#c99f4f);color:#1a1440;font-weight:700;
  transition:transform .15s, box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(233,201,127,.3)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;color:var(--gold);cursor:pointer;padding:4px 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 홈 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;margin-bottom:34px}
.hero .lead{font-size:17px;color:var(--muted);max-width:34em;margin-top:12px}
.hero .row{margin-top:22px}
.hero-cards{position:relative;width:220px;height:230px}
.hero-cards svg{position:absolute;width:120px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.hero-cards svg:nth-child(1){left:0;top:30px;transform:rotate(-12deg)}
.hero-cards svg:nth-child(2){left:50px;top:0;z-index:2}
.hero-cards svg:nth-child(3){left:100px;top:30px;transform:rotate(12deg)}
.progress{height:6px;border-radius:6px;background:rgba(185,168,255,.15);overflow:hidden;margin-top:18px;max-width:420px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--gold));border-radius:6px;transition:width .6s}

.act{border-top:1px solid rgba(233,201,127,.18);padding-block:26px}
.act-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.act-head p{color:var(--muted);margin-top:4px;max-width:36em}
.act.locked .act-head{opacity:.5}
.minis{display:flex;flex-wrap:wrap;gap:12px}
.mini{width:86px;background:none;border:0;padding:0;cursor:pointer;text-align:center;position:relative}
.mini svg{width:86px;display:block;border-radius:7px;transition:transform .2s, filter .2s}
.mini:hover svg{transform:translateY(-4px)}
.mini small{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.mini.locked{cursor:default}
.mini.locked svg{filter:grayscale(.6) brightness(.55)}
.mini.locked:hover svg{transform:none}
.mini.next svg{filter:drop-shadow(0 0 10px rgba(233,201,127,.7))}
.mini.next small{color:var(--gold)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#1a1440;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.pro-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:rgba(17,22,74,.55);border:1px solid rgba(185,168,255,.25);border-radius:16px;padding:18px}
.pro-card > div{flex:1 1 260px;min-width:0}

/* 레슨 */
.crumbs{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
.lesson{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:36px;align-items:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.stage-hint{font-size:14px;color:var(--gold);min-height:1.5em;text-align:center}
.card3d{width:min(300px,70vw);aspect-ratio:200/320;perspective:1200px;max-width:100%}
.card3d .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.card3d.flipped .inner{transform:rotateY(180deg)}
.card3d .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.card3d .face svg{width:100%;height:100%;display:block}
.card3d .front{transform:rotateY(180deg)}
.card3d .rot{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.4,.1,.2,1)}
.card3d.rev .rot{transform:rotate(180deg)}
.card3d.clickable{cursor:pointer}
.card3d.clickable:not(.flipped) .back{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hots{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s}
.card3d.show-hots .hots{opacity:1;pointer-events:auto}
.hot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff3c9;
  background:rgba(233,201,127,.35);color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 0 0 rgba(255,232,160,.7);animation:pulse 1.8s infinite}
.hot.found{background:var(--gold);color:#1a1440;animation:none;border-color:#fff}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,232,160,0)}100%{box-shadow:0 0 0 0 rgba(255,232,160,0)}}

.panel{background:rgba(14,18,62,.78);border:1px solid rgba(185,168,255,.22);border-radius:18px;padding:24px;min-width:0;
  display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(6px)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid rgba(185,168,255,.25);color:var(--muted)}
.steps li.on{border-color:var(--gold);color:var(--gold)}
.steps li.done{background:rgba(233,201,127,.14);color:var(--moon);border-color:transparent}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title-row .en{font-family:var(--f-latin);color:var(--gold);font-size:14px;letter-spacing:.08em}
.story{font-family:var(--f-display);font-size:17px;line-height:1.85;max-width:34em}
.symlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.symlist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:rgba(185,168,255,.08)}
.symlist li .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1440;font-weight:700;font-size:13px}
.symlist li.unk .n{background:transparent;border:1px dashed var(--gold-dim);color:var(--gold-dim)}
.symlist li.unk{color:var(--gold-dim)}
.symlist b{display:block;color:var(--moon)}
.symlist li.fresh{animation:pop .5s}
@keyframes pop{0%{transform:scale(.96);background:rgba(233,201,127,.3)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:3px 12px;font-size:14px;background:rgba(233,201,127,.14);border:1px solid rgba(233,201,127,.35)}
.chip.r{background:rgba(185,168,255,.12);border-color:rgba(185,168,255,.4)}
.meaning{display:grid;gap:8px;padding:14px;border-radius:14px;background:rgba(8,11,36,.55);border:1px solid rgba(233,201,127,.2)}
.meaning.r{border-color:rgba(185,168,255,.3)}
.meaning h3{font-size:15px;color:var(--gold);display:flex;align-items:center;gap:8px}
.meaning.r h3{color:var(--lav)}
.tip{font-size:14px;color:var(--muted);border-left:2px solid var(--gold-dim);padding-left:12px}

.opts{display:grid;gap:10px}
.opt{text-align:left;cursor:pointer;padding:12px 14px;border-radius:12px;border:1px solid rgba(185,168,255,.3);background:rgba(185,168,255,.06);font-size:15px;line-height:1.55;transition:border-color .2s, background .2s}
.opt:hover{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:rgba(143,224,176,.14)}
.opt.no{border-color:var(--bad);background:rgba(243,160,160,.1);opacity:.75}
.opt:disabled{cursor:default}
.fb{padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:rgba(143,224,176,.12);color:var(--ok)}
.fb.no{background:rgba(243,160,160,.1);color:var(--bad)}

/* 퀴즈 */
.quiz{max-width:720px;margin:0 auto;display:grid;gap:18px}
.quiz .q-card{width:150px;margin:0 auto}
.quiz .q-card svg{width:100%;display:block;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.dots{display:flex;gap:6px}
.dots span{width:26px;height:6px;border-radius:4px;background:rgba(185,168,255,.2)}
.dots span.ok{background:var(--ok)}.dots span.no{background:var(--bad)}.dots span.cur{background:var(--gold)}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:20px}
.result .big{font-family:var(--f-latin);font-size:56px;color:var(--gold);line-height:1}

/* 서막 */
.slide{max-width:760px;margin:0 auto;display:grid;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.stack{display:flex;gap:14px;flex-wrap:wrap}
.stack > div{flex:1 1 200px;min-width:0;padding:16px;border-radius:14px;background:rgba(17,22,74,.6);border:1px solid rgba(185,168,255,.22)}
.stack .num{font-family:var(--f-latin);font-size:34px;color:var(--gold);line-height:1.1}
.timeline{display:flex;flex-wrap:wrap;gap:6px}
.timeline span{font-family:var(--f-latin);font-size:13px;min-width:36px;text-align:center;padding:4px 6px;border-radius:8px;background:rgba(185,168,255,.1);border:1px solid rgba(185,168,255,.2)}
.timeline span.f{background:var(--gold);color:#1a1440;border-color:var(--gold)}
.timeline span.a1{border-color:rgba(233,201,127,.5)}
.timeline span.a3{border-color:rgba(239,159,183,.5)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.three > div{padding:16px;border-radius:14px;background:rgba(17,22,74,.6);border:1px solid rgba(185,168,255,.22);display:grid;gap:6px}
.three b{font-family:var(--f-display);font-size:18px;color:var(--gold)}

/* 리딩 */
.reading{display:grid;gap:22px}
.presets{display:grid;gap:10px;max-width:640px}
.field{display:flex;gap:10px;flex-wrap:wrap;max-width:640px}
.field input{flex:1 1 240px;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid rgba(185,168,255,.35);background:rgba(8,11,36,.7);color:var(--moon);font:inherit}
.fan{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;max-width:780px}
.fan button{background:none;border:0;padding:0;cursor:pointer;transition:transform .25s}
.fan button svg{width:100%;display:block;border-radius:5px}
.fan button:hover{transform:translateY(-6px)}
.fan button.picked{transform:translateY(-10px);filter:drop-shadow(0 0 10px rgba(233,201,127,.8))}
.fan button.picked::after{content:attr(data-n);position:relative;top:-28px;display:inline-block;background:var(--gold);color:#1a1440;border-radius:999px;font-weight:700;font-size:12px;padding:0 7px}
.spread{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.slot{display:grid;gap:10px;justify-items:center;text-align:center;min-width:0}
.slot .card3d{width:min(190px,100%)}
.slot .pos{font-family:var(--f-display);color:var(--gold);font-size:17px}
.slot .txt{font-size:14px;text-align:left;display:grid;gap:6px}
.summary{background:rgba(14,18,62,.78);border:1px solid rgba(233,201,127,.3);border-radius:18px;padding:22px;display:grid;gap:12px}

/* 모달 */
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,6,20,.82);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal-box{max-width:820px;width:100%;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:26px;align-items:start;
  background:rgba(14,18,62,.96);border:1px solid rgba(233,201,127,.3);border-radius:20px;padding:24px;position:relative}
.modal-box > svg{width:100%;border-radius:12px}
.modal-box .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}
.modal-box .info{display:grid;gap:12px;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:linear-gradient(180deg,#f3d995,#c99f4f);color:#1a1440;font-weight:700;padding:9px 18px;border-radius:999px;z-index:30;transition:all .35s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid rgba(233,201,127,.14);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.foot button{background:none;border:1px solid rgba(185,168,255,.3);border-radius:999px;padding:4px 12px;color:var(--muted);cursor:pointer;font-size:13px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero-cards{display:none}
  .lesson{grid-template-columns:1fr;gap:20px}
  .stage{position:static}
  .card3d{width:min(250px,66vw)}
  .split{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
  .modal-box{grid-template-columns:1fr}
  .modal-box > svg{max-width:220px;margin:0 auto}
  .spread{gap:8px}
  .slot .txt{font-size:13px}
  .panel{padding:18px}
}
/* 카드 일러스트 애니메이션 (작은 썸네일에서는 꺼서 가볍게) */
.a-spin,.a-spin-slow,.a-spin-f,.a-pulse,.a-breathe,.a-flick,.a-sway,.a-sway-s,.a-flap,.a-tilt,.a-swing,.a-crown,.a-dance,.a-flag{transform-box:fill-box;transform-origin:center}
.a-spin{animation:a-spin 40s linear infinite}
.a-spin-slow{animation:a-spin 80s linear infinite}
.a-spin-f{animation:a-spin 6s linear infinite}
.a-pulse{animation:a-pulse 4s ease-in-out infinite}
.a-glow{animation:a-glow 3.6s ease-in-out infinite}
.a-glow-soft{animation:a-glow-soft 5s ease-in-out infinite}
.a-tw{animation:a-tw 3s ease-in-out infinite}
.a-lamp{animation:a-lamp 2.4s ease-in-out infinite}
.a-flick{transform-origin:50% 100%;animation:a-flick .7s ease-in-out infinite alternate}
.a-fall{animation:a-fall 3.2s linear infinite}
.a-snow{animation:a-snow 6s linear infinite}
.a-wave{animation:a-wave 4s ease-in-out infinite alternate}
.a-wave2{animation:a-wave 5s ease-in-out infinite alternate-reverse}
.a-sway{transform-origin:50% 100%;animation:a-sway 4s ease-in-out infinite alternate}
.a-sway-s{transform-origin:50% 100%;animation:a-sway-s 5s ease-in-out infinite alternate}
.a-flap{transform-origin:100% 60%;animation:a-flap 2.6s ease-in-out infinite alternate}
.a-tilt{transform-origin:50% 0;animation:a-tilt 5s ease-in-out infinite alternate}
.a-swing{transform-origin:50% 0;animation:a-tilt 4.5s ease-in-out infinite alternate}
.a-crown{animation:a-crown 2.8s ease-in-out infinite alternate}
.a-bob{animation:a-bob 3.5s ease-in-out infinite alternate}
.a-flow{stroke-dasharray:7 5;animation:a-flow 1.1s linear infinite}
.a-flash{animation:a-flash 4.5s linear infinite}
.a-rise{animation:a-rise 6s ease-in-out infinite alternate}
.a-rise2{animation:a-rise2 3s ease-in-out infinite alternate}
.a-dance{transform-origin:50% 100%;animation:a-dance 3.2s ease-in-out infinite alternate}
.a-flag{transform-origin:0% 50%;animation:a-flag 3s ease-in-out infinite alternate}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-pulse{50%{transform:scale(1.07);opacity:.85}}
@keyframes a-glow{50%{opacity:.55}}
@keyframes a-glow-soft{50%{opacity:.8}}
@keyframes a-tw{50%{opacity:.15}}
@keyframes a-lamp{0%,100%{opacity:1}30%{opacity:.75}45%{opacity:.95}70%{opacity:.7}}
@keyframes a-flick{to{transform:scale(1.12,.86)}}
@keyframes a-fall{0%{transform:translateY(-6px);opacity:0}15%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes a-snow{0%{transform:translate(0,-10px);opacity:0}20%{opacity:.9}100%{transform:translate(-8px,40px);opacity:0}}
@keyframes a-wave{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes a-sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes a-sway-s{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
@keyframes a-flap{from{transform:rotate(-2deg)}to{transform:rotate(7deg)}}
@keyframes a-tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes a-crown{from{transform:translate(0,0) rotate(0)}to{transform:translate(4px,7px) rotate(14deg)}}
@keyframes a-bob{from{transform:translateY(-2.5px)}to{transform:translateY(2.5px)}}
@keyframes a-flow{to{stroke-dashoffset:-12}}
@keyframes a-flash{0%,62%,70%,100%{opacity:1}64%,68%{opacity:.2}66%{opacity:1}}
@keyframes a-rise{from{transform:translateY(4px)}to{transform:translateY(-3px)}}
@keyframes a-rise2{from{transform:translateY(2px)}to{transform:translateY(-4px)}}
@keyframes a-dance{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes a-flag{from{transform:skewY(-2deg)}to{transform:skewY(2deg) scaleX(.97)}}
.mini svg *,.fan svg *{animation:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="320">

function rng(seed){let s=seed*9301+49297;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function cardSVG(c,{hide=false}={}){
  const r=rng(c.id+7);let st='';
  for(let i=0;i<26;i++)st+=`<circle cx="${f1(14+r()*172)}" cy="${f1(40+r()*170)}" r="${f1(.35+r()*.9)}" fill="${MOON}" opacity="${f1(.3+r()*.6)}" class="a-tw" style="animation-delay:${f1(r()*4)}s;animation-duration:${f1(2+r()*3)}s"/>`;
  const label=hide?'이름을 가린 타로 카드':`${c.num} ${c.ko} 카드 일러스트`;
  return `<svg viewBox="0 0 200 320" role="img" aria-label="${label}">
  <rect x="0.75" y="0.75" width="198.5" height="318.5" rx="12" fill="url(#sky)" stroke="${GOLDC}" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="198.5" height="318.5" rx="12" fill="${c.tint}" opacity=".16"/>
  <g clip-path="url(#artclip)">${st}${ART[c.id]()}</g>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="${GD}" stroke-width=".9" opacity=".8"/>
  ${hide?`<rect x="74" y="15" width="52" height="21" rx="10.5" fill="${INK}" fill-opacity=".85" stroke="${GD}" stroke-width=".8"/><text x="100" y="30" text-anchor="middle" font-family="Cinzel,serif" font-size="12" fill="${GOLDC}">?</text>`
  :`<rect x="${100-Math.max(22,c.num.length*5+12)}" y="15" width="${Math.max(44,c.num.length*10+24)}" height="21" rx="10.5" fill="${INK}" fill-opacity=".85" stroke="${GD}" stroke-width=".8"/><text x="100" y="30" text-anchor="middle" font-family="Cinzel,serif" font-size="12" font-weight="700" fill="${GOLDC}" letter-spacing="1.5">${c.num}</text>`}
  <rect x="${hide?62:100-Math.max(36,c.ko.length*7+16)}" y="284" width="${hide?76:Math.max(72,c.ko.length*14+32)}" height="23" rx="11.5" fill="${INK}" fill-opacity=".88" stroke="${GD}" stroke-width=".9"/>

/* ───────────── 저장 ───────────── */
const KEY='byeolbit-tarot-v1';
function blank(){return{done:{},passed:{},xp:0,prologue:false,readings:0}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.done)return Object.assign(blank(),v)}catch(e){}return blank()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}hud()}
function hud(){document.getElementById('hud-cards').textContent=`${Object.keys(S.done).length} / 22`;document.getElementById('hud-xp').textContent=S.xp}
function gain(n,msg){S.xp+=n;save();toast(`${msg} +${n} 별빛`)}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}

/* 해금 규칙 */
const actOpen=n=>n===1?S.prologue:!!S.passed[n-1];
function cardOpen(id){const a=actOf(id);if(!actOpen(a.n))return false;const i=a.cards.indexOf(id);return i===0||!!S.done[a.cards[i-1]]}
const actAllDone=a=>a.cards.every(id=>S.done[id]);
function nextThing(){
  if(!S.prologue)return{t:'prologue'};
  for(const a of ACTS){if(!actOpen(a.n))break;const c=a.cards.find(id=>!S.done[id]);if(c!==undefined)return{t:'lesson',id:c};if(!S.passed[a.n])return{t:'quiz',n:a.n}}
  return{t:'reading'};
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const chips=(arr,cls='')=>`<div class="chips">${arr.map(k=>`<span class="chip ${cls}">${k}</span>`).join('')}</div>`;
let screen='home';
function show(html,name){screen=name;app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}

const PRO_Q=[
 {q:'메이저 아르카나는 모두 몇 장일까요?',o:['22장','56장','78장','12장'],a:0,ex:'메이저 22장 + 마이너 56장 = 78장이에요.'},
 {q:'역방향으로 나온 카드는 보통 무엇을 뜻할까요?',o:['무조건 나쁜 일이 생긴다는 뜻','그 에너지가 막히거나, 지나치거나, 안으로 향해 있다는 뜻','카드를 잘못 뽑았으니 다시 뽑아야 한다는 뜻'],a:1,ex:'역방향은 경고라기보다 에너지의 흐름이 달라졌다는 신호예요.'},
 {q:'카드를 처음 읽을 때 가장 먼저 해야 할 일은?',o:['키워드 외우기','그림을 천천히 관찰하기','결과를 단정하기'],a:1,ex:'보기 → 느끼기 → 연결하기. 관찰이 먼저예요.'}
];
function startPrologue(){P={i:0,rev:false,qi:0,wrong:new Set(),answered:false};renderPrologue()}
function renderPrologue(){
  const total=PROLOGUE.length;
  if(P.i<total){
    show(`<div class="crumbs"><button class="link" data-act="home">← 여정 지도</button><span>서막 · 타로의 문</span></div>
    <div class="slide panel">
      <ol class="steps">${PROLOGUE.map((_,i)=>`<li class="${i<P.i?'done':i===P.i?'on':''}">${i+1}</li>`).join('')}<li class="${P.i===total?'on':''}">확인</li></ol>
      ${PROLOGUE[P.i]()}
      <div class="row">${P.i>0?'<button class="btn ghost" data-act="pprev">← 이전</button>':''}<button class="btn" data-act="pnext">${P.i===total-1?'확인 문제 풀기':'다음'} →</button></div>
    </div>`,'prologue');
    return;
  }
  if(P.qi>=PRO_Q.length){
    show(`<div class="slide panel result"><p class="eyebrow">Prologue Complete</p><div class="big">✦</div><h2>타로의 문이 열렸어요</h2><p class="muted">이제 0번 바보와 함께 1막을 시작해요.</p><div class="row" style="justify-content:center"><button class="btn" data-act="lesson" data-id="0">1막 시작하기 →</button><button class="btn ghost" data-act="home">지도로</button></div></div>`,'prologue');
    return;
  }
  const q=PRO_Q[P.qi];
  show(`<div class="crumbs"><button class="link" data-act="home">← 여정 지도</button><span>서막 · 확인 문제 ${P.qi+1}/${PRO_Q.length}</span></div>
  <div class="quiz panel"><h2>${q.q}</h2>
   <div class="opts">${q.o.map((o,i)=>`<button class="opt ${P.answered&&i===q.a?'ok':''} ${P.wrong.has(i)?'no':''}" data-act="pans" data-i="${i}" ${P.answered||P.wrong.has(i)?'disabled':''}>${o}</button>`).join('')}</div>
   ${P.answered?`<div class="fb ok">정답이에요. ${q.ex}</div><div class="row"><button class="btn" data-act="pqnext">다음 →</button></div>`:P.wrong.size?`<div class="fb no">다시 생각해 보세요.</div>`:''}
  </div>`,'prologue');
}

/* ───────────── 레슨 ───────────── */
let Ls=null;
const STEP_NAMES=['뽑기','관찰','의미','확인'];
function startLesson(id){
  if(!cardOpen(id)&&!S.done[id]){toast('아직 열리지 않은 카드예요');return}
  const others=shuffle(CARDS.filter(c=>c.id!==id)).slice(0,2);
  Ls={id,step:0,flipped:false,found:new Set(),fresh:-1,rev:false,sawRev:false,solved:false,wrong:new Set(),opts:shuffle([id,...others.map(o=>o.id)])};
  const c=CARDS[id],a=actOf(id);
  show(`<div class="crumbs"><button class="link" data-act="home">← 여정 지도</button><span>${a.title}</span><span>·</span><span>${a.cards.indexOf(id)+1} / ${a.cards.length}</span></div>
  <div class="lesson">
    <div class="stage">
      <div class="card3d clickable" id="c3d" data-act="flip">
        <div class="inner">
          <div class="face back">${backSVG()}</div>
          <div class="face front"><div class="rot">${cardSVG(c)}
            <div class="hots">${c.sym.map((s,i)=>`<button class="hot" data-act="hot" data-i="${i}" style="left:${f1(s.x/2)}%;top:${f1(s.y/3.2)}%" aria-label="상징 ${i+1}">${i+1}</button>`).join('')}</div>
          </div></div>
        </div>
      </div>
      <p class="stage-hint" id="hint"></p>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>`,'lesson');
  syncStage();renderPanel();
}
function syncStage(){
  const el=document.getElementById('c3d');if(!el)return;
  el.classList.toggle('flipped',Ls.flipped);el.classList.toggle('clickable',!Ls.flipped||Ls.step===2);
  el.classList.toggle('show-hots',Ls.step===1);el.classList.toggle('rev',Ls.rev);
  el.querySelectorAll('.hot').forEach((h,i)=>h.classList.toggle('found',Ls.found.has(i)));
  document.getElementById('hint').textContent=!Ls.flipped?'카드를 눌러 뒤집어 보세요':Ls.step===1?'빛나는 숫자를 눌러보세요':Ls.step===2?'카드를 눌러 돌려볼 수 있어요':'';
}
function renderPanel(){
  const c=CARDS[Ls.id],p=document.getElementById('panel');
  const steps=`<ol class="steps">${STEP_NAMES.map((n,i)=>`<li class="${i<Ls.step?'done':i===Ls.step?'on':''}">${i+1} ${n}</li>`).join('')}</ol>`;
  const title=`<div class="title-row"><h2>${c.num} · ${c.ko}</h2><span class="en">${c.en}</span></div>`;
  let body='';
  if(Ls.step===0){
    body=!Ls.flipped
      ?`<p class="eyebrow">Draw</p><h2>한 장이 당신을 기다려요</h2><p class="story">${Ls.id===0?'여정의 첫 카드예요. 숨을 한 번 고르고, 카드를 뒤집어 보세요.':'바보의 여정이 이어져요. 다음에 만날 스승은 누구일까요? 카드를 눌러 뒤집어 보세요.'}</p><div class="row"><button class="btn" data-act="flip">카드 뒤집기</button></div>`
      :`${title}<p class="story">${c.story}</p><p class="tip">뜻을 보기 전에, 그림에서 무엇이 먼저 눈에 들어오는지 잠깐 느껴보세요.</p><div class="row"><button class="btn" data-act="next">그림 속 상징 찾기 →</button></div>`;
  }else if(Ls.step===1){
    const all=Ls.found.size===c.sym.length;
    body=`${title}<p>카드 위에 빛나는 숫자 ${c.sym.length}개를 눌러 상징을 찾아보세요. <b style="color:var(--gold)">${Ls.found.size} / ${c.sym.length}</b></p>
    <ul class="symlist">${c.sym.map((s,i)=>Ls.found.has(i)?`<li class="${Ls.fresh===i?'fresh':''}"><span class="n">${i+1}</span><div><b>${s.n}</b>${s.d}</div></li>`:`<li class="unk"><span class="n">${i+1}</span><div>아직 찾지 못한 상징</div></li>`).join('')}</ul>
    ${all?`<p class="tip">상징을 알고 나면 키워드가 저절로 이해돼요. 이제 의미를 배워볼까요?</p>`:''}
    <div class="row"><button class="btn" data-act="next" ${all?'':'disabled'}>의미 배우기 →</button></div>`;
  }else if(Ls.step===2){
    body=`${title}
    <div class="meaning"><h3>▲ 정방향</h3>${chips(c.up)}<p>${c.upM}</p></div>
    ${Ls.sawRev?`<div class="meaning r"><h3>▼ 역방향</h3>${chips(c.rev,'r')}<p>${c.revM}</p></div>`:`<p class="tip">카드가 거꾸로 나오면 뜻이 어떻게 바뀔까요? 카드를 돌려보세요.</p>`}
    <div class="row"><button class="btn ghost" data-act="rot">${Ls.rev?'↻ 정방향으로':'↻ 거꾸로 돌려보기'}</button><button class="btn" data-act="next" ${Ls.sawRev?'':'disabled'}>확인 문제 →</button></div>`;
  }else{
    const q=Ls.opts;
    if(!Ls.solved){
      body=`${title}<p class="eyebrow">Check</p><h3>‘${c.ko}’ 카드가 정방향으로 나왔어요. 가장 알맞은 해석은?</h3>
      <div class="opts">${q.map(id=>`<button class="opt ${Ls.wrong.has(id)?'no':''}" data-act="lans" data-id="${id}" ${Ls.wrong.has(id)?'disabled':''}>${CARDS[id].upM}</button>`).join('')}</div>
      ${Ls.wrong.size?`<div class="fb no">그건 ‘${CARDS[[...Ls.wrong].pop()].ko}’ 카드의 뜻이에요. 키워드 ${c.up.slice(0,2).map(k=>'‘'+k+'’').join(', ')}을 떠올려 보세요.</div>`:''}`;
    }else{
      const a=actOf(Ls.id),i=a.cards.indexOf(Ls.id),nextId=a.cards[i+1];
      body=`${title}<div class="fb ok">정답이에요! ‘${c.ko}’ 카드를 도감에 담았어요.</div>
      <div class="meaning"><h3>한 줄 정리</h3><p><b>${c.up[0]}</b>과 <b>${c.up[1]}</b>의 카드. 거꾸로 나오면 <b>${c.rev[0]}</b>.</p><p class="muted">스스로에게 물어보기: ${c.ask}</p></div>
      <div class="row">${nextId!==undefined?`<button class="btn" data-act="lesson" data-id="${nextId}">다음 카드 →</button>`:`<button class="btn" data-act="cquiz" data-n="${a.n}">${a.title} 정리 퀴즈 →</button>`}<button class="btn ghost" data-act="home">지도로</button></div>`;
    }
  }
  p.innerHTML=steps+body;
}

/* ───────────── 막 정리 퀴즈 ───────────── */
let Q=null;
function startQuiz(n){
  const a=ACTS[n-1];if(!actAllDone(a))return;
  const ids=shuffle(a.cards).slice(0,5),types=shuffle(['image','keyword','scene','reversed','image']);
  Q={n,i:0,score:0,res:[],picked:null,qs:ids.map((id,k)=>({id,type:types[k],opts:shuffle([id,...shuffle(a.cards.filter(x=>x!==id)).slice(0,3)])}))};
  renderQuiz();
}
function renderQuiz(){
  const a=ACTS[Q.n-1];
  if(Q.i>=Q.qs.length){
    const pass=Q.score>=3,first=pass&&!S.passed[Q.n];
    if(pass){S.passed[Q.n]=true;save();if(first)gain(30,`${a.title} 통과!`)}
    show(`<div class="quiz panel result"><p class="eyebrow">${a.title}</p><div class="big">${Q.score} / ${Q.qs.length}</div>
      <h2>${pass?(Q.n===3?'모든 막을 마쳤어요!':'다음 막이 열렸어요'):'조금만 더 복습해 볼까요?'}</h2>
      <p class="muted">${pass?(Q.n===3?'이제 직접 첫 리딩을 해볼 차례예요.':'바보의 여정은 계속돼요.'):'3문제 이상 맞히면 통과예요. 지도에서 카드를 눌러 복습할 수 있어요.'}</p>
      <div class="row" style="justify-content:center">${pass?(Q.n===3?'<button class="btn" data-act="reading">첫 리딩 하러 가기 →</button>':`<button class="btn" data-act="lesson" data-id="${ACTS[Q.n].cards[0]}">${ACTS[Q.n].title} 시작 →</button>`):`<button class="btn" data-act="cquiz" data-n="${Q.n}">다시 풀기</button>`}<button class="btn ghost" data-act="home">지도로</button></div></div>`,'quiz');
    return;
  }
  const q=Q.qs[Q.i],c=CARDS[q.id];
  const prompt={image:'이 카드의 이름은 무엇일까요?',keyword:`정방향 키워드가 ‘${c.up.slice(0,3).join(' · ')}’인 카드는?`,scene:`이 상황에 가장 어울리는 카드는?<br><span class="muted" style="font-family:var(--f-body);font-size:16px;font-weight:400">“${c.scene}”</span>`,reversed:`역방향으로 나왔을 때 ‘${c.rev.slice(0,3).join(' · ')}’을 뜻하는 카드는?`}[q.type];
  const done=Q.picked!==null;
  show(`<div class="crumbs"><button class="link" data-act="home">← 여정 지도</button><span>${a.title} · 정리 퀴즈</span></div>
  <div class="quiz panel">
    <div class="dots">${Q.qs.map((_,i)=>`<span class="${i<Q.i?(Q.res[i]?'ok':'no'):i===Q.i?'cur':''}"></span>`).join('')}</div>
    ${q.type==='image'?`<div class="q-card">${cardSVG(c,{hide:true})}</div>`:''}
    <h2>${prompt}</h2>
    <div class="opts">${q.opts.map(id=>`<button class="opt ${done&&id===q.id?'ok':''} ${done&&Q.picked===id&&id!==q.id?'no':''}" data-act="qans" data-id="${id}" ${done?'disabled':''}>${CARDS[id].num} · ${CARDS[id].ko}</button>`).join('')}</div>
    ${done?`<div class="fb ${Q.picked===q.id?'ok':'no'}">${Q.picked===q.id?'정답!':'아쉬워요. 정답은 ‘'+c.ko+'’예요.'} ${c.upM}</div><div class="row"><button class="btn" data-act="qnext">${Q.i===Q.qs.length-1?'결과 보기':'다음 문제'} →</button></div>`:''}
  </div>`,'quiz');
}

/* ───────────── 졸업 리딩 ───────────── */
let Rd=null;
const POS=[['과거','이 일의 뿌리'],['현재','지금의 흐름'],['미래','다가올 가능성']];
const PRESETS=['이번 달 나의 일은 어떻게 흘러갈까?','지금 관계에서 내가 알아야 할 것은?','요즘 내 마음은 어떤 상태일까?','새로 시작하려는 일, 어떻게 접근하면 좋을까?'];
function startReading(){if(!S.passed[3]){toast('3막을 마치면 열려요');return}Rd={phase:'ask',q:'',deck:shuffle(CARDS.map(c=>c.id)),picks:[],open:[false,false,false]};renderReading()}
function renderReading(){
  const head=`<div class="crumbs"><button class="link" data-act="home">← 여정 지도</button><span>졸업 · 첫 번째 리딩</span></div>`;
  if(Rd.phase==='ask'){
    show(head+`<div class="reading"><div><p class="eyebrow">Step 1 · Question</p><h2>무엇을 물어볼까요?</h2><p class="muted" style="margin-top:6px">좋은 질문은 ‘예/아니오’보다 ‘어떻게’, ‘무엇을’로 시작해요.</p></div>
     <div class="presets">${PRESETS.map((p,i)=>`<button class="opt" data-act="rq" data-i="${i}">${p}</button>`).join('')}</div>
     <form class="field" id="rq-form"><input id="rq-input" maxlength="80" placeholder="직접 질문 쓰기" aria-label="직접 질문 쓰기"><button class="btn" type="submit">이 질문으로</button></form></div>`,'reading');
    document.getElementById('rq-form').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('rq-input').value.trim();if(v){Rd.q=v;Rd.phase='pick';renderReading()}});
    return;
  }
  if(Rd.phase==='pick'){
    show(head+`<div class="reading"><div><p class="eyebrow">Step 2 · Draw</p><h2>마음이 가는 카드 3장을 고르세요</h2><p class="muted" style="margin-top:6px">질문: “${esc(Rd.q)}” · 고른 순서대로 과거, 현재, 미래 자리에 놓여요.</p></div>
     <div class="fan">${Rd.deck.map((id,i)=>{const k=Rd.picks.findIndex(p=>p.id===id);return `<button data-act="rpick" data-i="${i}" class="${k>=0?'picked':''}" data-n="${k+1}" aria-label="카드 ${i+1}${k>=0?' 선택됨':''}">${backSVG()}</button>`}).join('')}</div>
     <div class="row"><button class="btn" data-act="rgo" ${Rd.picks.length===3?'':'disabled'}>카드 펼치기 (${Rd.picks.length}/3) →</button></div></div>`,'reading');
    return;
  }
  const allOpen=Rd.open.every(Boolean);
  const kw=p=>{const c=CARDS[p.id];return p.rev?c.rev[0]:c.up[0]};
  show(head+`<div class="reading"><div><p class="eyebrow">Step 3 · Read</p><h2>“${esc(Rd.q)}”</h2><p class="muted" style="margin-top:6px">카드를 하나씩 눌러 펼치세요. 뒤집기 전에 그림을 먼저 상상해 보는 것도 좋아요.</p></div>
   <div class="spread">${Rd.picks.map((p,i)=>{const c=CARDS[p.id];return `<div class="slot"><div class="pos">${POS[i][0]}</div><p class="muted" style="font-size:13px">${POS[i][1]}</p>
     <div class="card3d ${Rd.open[i]?'flipped':'clickable'} ${p.rev?'rev':''}" data-act="rflip" data-i="${i}"><div class="inner"><div class="face back">${backSVG()}</div><div class="face front"><div class="rot">${cardSVG(c)}</div></div></div></div>
     ${Rd.open[i]?`<div class="txt"><b>${c.ko} · ${p.rev?'역방향 ▼':'정방향 ▲'}</b>${chips(p.rev?c.rev.slice(0,3):c.up.slice(0,3),p.rev?'r':'')}<span>${p.rev?c.revM:c.upM}</span></div>`:''}</div>`}).join('')}</div>
   ${allOpen?`<div class="summary"><p class="eyebrow">Reading</p><h3>이야기로 이어 읽기</h3>
     <p class="story">과거의 ‘${kw(Rd.picks[0])}’에서 시작해, 지금은 ‘${kw(Rd.picks[1])}’의 흐름 위에 있어요. 이 흐름이 이어진다면 앞으로는 ‘${kw(Rd.picks[2])}’ 쪽으로 나아갈 가능성이 보여요.</p>
     <p class="tip">미래 카드는 정해진 결말이 아니라 지금 흐름이 이어질 때의 모습이에요. 현재 카드가 건네는 질문을 스스로에게 던져 보세요. “${CARDS[Rd.picks[1].id].ask}”</p>
     <div class="row"><button class="btn" data-act="reading">새 질문으로 다시</button><button class="btn ghost" data-act="home">지도로</button></div></div>`:''}
  </div>`,'reading');
}

/* ───────────── 도감 모달 ───────────── */
function openCodex(id){
  const c=CARDS[id],root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal" data-act="close-bg" role="dialog" aria-modal="true" aria-label="${c.ko} 카드 정보"><div class="modal-box">
    <button class="x" data-act="close" aria-label="닫기">×</button>${cardSVG(c)}
    <div class="info"><div class="title-row"><h2>${c.num} · ${c.ko}</h2><span class="en">${c.en}</span></div>
     <p class="story" style="font-size:15px">${c.story}</p>
     <div class="meaning"><h3>▲ 정방향</h3>${chips(c.up)}<p>${c.upM}</p></div>
     <div class="meaning r"><h3>▼ 역방향</h3>${chips(c.rev,'r')}<p>${c.revM}</p></div>
     <ul class="symlist">${c.sym.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${s.n}</b>${s.d}</div></li>`).join('')}</ul>
     <div class="row"><button class="btn ghost" data-act="lesson" data-id="${id}">레슨 다시 하기</button></div></div></div></div>`;
  root.querySelector('.x').focus();
}
const closeModal=()=>{document.getElementById('modal-root').innerHTML=''};

/* ───────────── 이벤트 ───────────── */
const H={
  home:()=>{closeModal();renderHome()},
  continue:()=>{const n=nextThing();({prologue:startPrologue,lesson:()=>startLesson(n.id),quiz:()=>startQuiz(n.n),reading:startReading})[n.t]()},
  prologue:startPrologue,
  pnext:()=>{P.i++;renderPrologue()},pprev:()=>{P.i--;renderPrologue()},
  prorot:()=>{P.rev=!P.rev;const el=document.getElementById('pro-card');el.classList.toggle('rev',P.rev);const c=CARDS[17];
    document.getElementById('pro-rev').outerHTML=P.rev?`<div id="pro-rev" class="meaning r"><h3>역방향 · 별</h3>${chips(c.rev,'r')}<p>${c.revM}</p></div>`:`<div id="pro-rev" class="meaning"><h3>정방향 · 별</h3>${chips(c.up)}<p>${c.upM}</p></div>`},
  pans:t=>{const q=PRO_Q[P.qi],i=+t.dataset.i;if(i===q.a)P.answered=true;else P.wrong.add(i);renderPrologue()},
  pqnext:()=>{P.qi++;P.answered=false;P.wrong=new Set();if(P.qi>=PRO_Q.length&&!S.prologue){S.prologue=true;gain(20,'서막 완료!')}renderPrologue()},
  lesson:t=>{closeModal();startLesson(+t.dataset.id)},
  flip:()=>{if(screen!=='lesson')return;
    if(!Ls.flipped){Ls.flipped=true;syncStage();renderPanel();return}
    if(Ls.step===2)H.rot()},
  next:()=>{Ls.step++;if(Ls.step===3&&Ls.rev){Ls.rev=false}syncStage();renderPanel()},
  hot:(t,e)=>{e.stopPropagation();const i=+t.dataset.i;if(!Ls.found.has(i)){Ls.found.add(i);Ls.fresh=i}syncStage();renderPanel()},
  rot:()=>{Ls.rev=!Ls.rev;if(Ls.rev)Ls.sawRev=true;syncStage();renderPanel()},
  lans:t=>{const id=+t.dataset.id;if(id===Ls.id){Ls.solved=true;const first=!S.done[Ls.id];S.done[Ls.id]=true;save();if(first)gain(Ls.wrong.size?10:15,`${CARDS[Ls.id].ko} 습득`)}else Ls.wrong.add(id);renderPanel()},
  cquiz:t=>startQuiz(+t.dataset.n),
  qans:t=>{const id=+t.dataset.id,q=Q.qs[Q.i];Q.picked=id;const ok=id===q.id;Q.res[Q.i]=ok;if(ok)Q.score++;renderQuiz()},
  qnext:()=>{Q.i++;Q.picked=null;renderQuiz()},
  reading:startReading,
  rq:t=>{Rd.q=PRESETS[+t.dataset.i];Rd.phase='pick';renderReading()},
  rpick:t=>{const id=Rd.deck[+t.dataset.i],k=Rd.picks.findIndex(p=>p.id===id);if(k>=0)Rd.picks.splice(k,1);else if(Rd.picks.length<3)Rd.picks.push({id,rev:Math.random()<.3});
    document.querySelectorAll('.fan button').forEach((b,i)=>{const kk=Rd.picks.findIndex(p=>p.id===Rd.deck[i]);b.classList.toggle('picked',kk>=0);b.dataset.n=kk+1});
    const go=document.querySelector('[data-act="rgo"]');go.disabled=Rd.picks.length!==3;go.textContent=`카드 펼치기 (${Rd.picks.length}/3) →`},
  rgo:()=>{Rd.phase='read';renderReading()},
  rflip:t=>{const i=+t.dataset.i;if(Rd.open[i])return;Rd.open[i]=true;t.classList.add('flipped');t.classList.remove('clickable');
    setTimeout(()=>{if(Rd.open.every(Boolean)){S.readings++;gain(20,'첫 리딩 완성!')}const y=window.scrollY;renderReading();window.scrollTo(0,y)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:900)},
  codex:t=>openCodex(+t.dataset.id),
  close:closeModal,
  'close-bg':(t,e)=>{if(e.target===t)closeModal()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=H[t.dataset.act];if(f)f(t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
let resetArm=false;
document.getElementById('reset').addEventListener('click',e=>{const b=e.currentTarget;if(!resetArm){resetArm=true;b.textContent='정말 초기화할까요? 한 번 더 누르세요';setTimeout(()=>{resetArm=false;b.textContent='진행 초기화'},4000);return}
  resetArm=false;b.textContent='진행 초기화';S=blank();save();renderHome();toast('처음부터 다시 시작해요')});

/* ───────────── 밤하늘 ───────────── */
(function sky(){
  const cv=document.getElementById("starfield"),ctx=cv.getContext('2d');let W,Hh,stars=[];
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;Hh=cv.height=innerHeight*d;
    stars=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*W,y:Math.random()*Hh,r:(Math.random()*1.1+.3)*d,p:Math.random()*6.28,s:.4+Math.random()*1.2}));draw(0)}
  function draw(t){ctx.clearRect(0,0,W,Hh);for(const s of stars){const a=.35+.45*Math.sin(s.p+t*.001*s.s);ctx.globalAlpha=Math.max(.08,a);ctx.fillStyle='#f4f0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}}
  function loop(t){draw(t);requestAnimationFrame(loop)}
  addEventListener('resize',size);size();if(!still)requestAnimationFrame(loop);
})();

hud();renderHome();
</script>
